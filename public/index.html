<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Billetera Pro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .bg-gradient-success { background: linear-gradient(45deg, #1cc88a, #13855c); color: white; }
        .bg-gradient-danger { background: linear-gradient(45deg, #e74a3b, #be2617); color: white; }
        .saldo-total { font-size: 2.5rem; font-weight: 700; color: #2e59d9; }
        .transaccion-item { transition: transform 0.2s; }
        .transaccion-item:hover { transform: translateX(5px); background-color: #fafafa; }
    </style>
</head>
<body class="py-4">

<div class="container">
    <div class="text-center mb-5">
        <h1 class="fw-bold"><i class="fas fa-wallet text-primary"></i> Control de Gastos</h1>
        <p class="text-muted">Administra tu dinero de forma inteligente</p>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card p-3 text-center border-start border-4 border-primary">
                <p class="text-uppercase small text-muted fw-bold mb-1">Balance Total</p>
                <div class="saldo-total" id="balance">$0.00</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 text-center border-start border-4 border-success">
                <p class="text-uppercase small text-muted fw-bold mb-1">Ingresos</p>
                <h3 class="text-success fw-bold" id="ingresos">+$0.00</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 text-center border-start border-4 border-danger">
                <p class="text-uppercase small text-muted fw-bold mb-1">Gastos</p>
                <h3 class="text-danger fw-bold" id="gastos">-$0.00</h3>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card mb-4">
                <div class="card-header bg-white fw-bold py-3">
                    <i class="fas fa-plus-circle"></i> Agregar Movimiento
                </div>
                <div class="card-body">
                    <form id="formulario">
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <input type="text" class="form-control" id="texto" placeholder="Ej: Sueldo, Tacos..." required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">Monto</label>
                                <input type="number" step="0.01" class="form-control" id="monto" placeholder="-50 o 100" required>
                                <small class="text-muted" style="font-size: 0.8em">Usa negativo (-) para gastos</small>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Fecha</label>
                                <input type="date" class="form-control" id="fecha" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">
                            Guardar Transacción
                        </button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h6 class="text-center text-muted mb-3">Distribución</h6>
                    <div style="height: 250px; position: relative;">
                        <canvas id="miGrafica"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="card h-100">
                <div class="card-header bg-white fw-bold py-3 d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-list"></i> Historial Reciente</span>
                    <span class="badge bg-secondary" id="contador">0 movs</span>
                </div>
                <div class="card-body p-0">
                    <ul id="lista" class="list-group list-group-flush">
                        </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Referencias a elementos del HTML
    const balanceEl = document.getElementById('balance');
    const ingresosEl = document.getElementById('ingresos');
    const gastosEl = document.getElementById('gastos');
    const listaEl = document.getElementById('lista');
    const formulario = document.getElementById('formulario');
    const fechaInput = document.getElementById('fecha');
    const contadorEl = document.getElementById('contador');

    // Variable para la gráfica
    let graficoDona;

    // Poner la fecha de hoy por defecto al cargar
    fechaInput.valueAsDate = new Date();

    // 1. CARGAR DATOS DEL SERVIDOR
    async function cargarTransacciones() {
        try {
            const res = await fetch('/api/transacciones');
            const datos = await res.json();
            actualizarInterfaz(datos);
        } catch (error) {
            console.error("Error cargando datos:", error);
        }
    }

    // 2. ACTUALIZAR PANTALLA
    function actualizarInterfaz(transacciones) {
        // A. Calcular Totales
        const montos = transacciones.map(t => parseFloat(t.monto));
        const total = montos.reduce((acc, item) => acc + item, 0).toFixed(2);
        
        const ingresos = montos
            .filter(item => item > 0)
            .reduce((acc, item) => acc + item, 0)
            .toFixed(2);

        const gastos = (montos
            .filter(item => item < 0)
            .reduce((acc, item) => acc + item, 0) * -1)
            .toFixed(2);

        // B. Mostrar en el HTML
        balanceEl.innerText = `$${total}`;
        ingresosEl.innerText = `+$${ingresos}`;
        gastosEl.innerText = `-$${gastos}`;
        contadorEl.innerText = `${transacciones.length} movs`;

        // C. Llenar la lista
        listaEl.innerHTML = '';
        
        // Ordenar: más recientes primero
        transacciones.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

        transacciones.forEach(t => {
            const signo = t.monto < 0 ? '-' : '+';
            const claseColor = t.monto < 0 ? 'text-danger' : 'text-success';
            const bordeColor = t.monto < 0 ? 'border-danger' : 'border-success';
            
            const elemento = document.createElement('li');
            elemento.classList.add('list-group-item', 'd-flex', 'justify-content-between', 'align-items-center', 'transaccion-item', 'py-3', 'border-start', 'border-4');
            
            // Añadir borde de color según tipo
            if(t.monto < 0) elemento.classList.add('border-danger');
            else elemento.classList.add('border-success');

            // Formatear fecha
            const fechaObj = new Date(t.fecha);
            const fechaTexto = fechaObj.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });

            elemento.innerHTML = `
                <div>
                    <h6 class="mb-0 fw-bold text-dark">${t.texto}</h6>
                    <small class="text-muted"><i class="far fa-clock"></i> ${fechaTexto}</small>
                </div>
                <div class="d-flex align-items-center">
                    <span class="fs-5 fw-bold ${claseColor} me-3">
                        ${signo}$${Math.abs(t.monto).toFixed(2)}
                    </span>
                    <button class="btn btn-outline-secondary btn-sm rounded-circle" onclick="borrarTransaccion(${t.id})">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;
            listaEl.appendChild(elemento);
        });

        // D. Actualizar Gráfica
        actualizarGrafica(ingresos, gastos);
    }

    // 3. GRÁFICA (Chart.js)
    function actualizarGrafica(ingresos, gastos) {
        const ctx = document.getElementById('miGrafica').getContext('2d');
        
        if (graficoDona) {
            graficoDona.destroy();
        }

        graficoDona = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Ingresos', 'Gastos'],
                datasets: [{
                    data: [ingresos, gastos],
                    backgroundColor: ['#1cc88a', '#e74a3b'],
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });
    }

    // 4. AGREGAR TRANSACCIÓN
    formulario.addEventListener('submit', async (e) => {
        e.preventDefault();

        const nuevaTransaccion = {
            texto: document.getElementById('texto').value,
            monto: document.getElementById('monto').value,
            fecha: document.getElementById('fecha').value
        };

        await fetch('/api/transacciones', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(nuevaTransaccion)
        });

        // Limpiar formulario
        document.getElementById('texto').value = '';
        document.getElementById('monto').value = '';
        cargarTransacciones();
    });

    // 5. BORRAR TRANSACCIÓN
    async function borrarTransaccion(id) {
        if(confirm('¿Eliminar este movimiento?')) {
            await fetch(`/api/transacciones/${id}`, { method: 'DELETE' });
            cargarTransacciones();
        }
    }

    // Iniciar app
    cargarTransacciones();

</script>

</body>
</html>
