<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista de Tareas </title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header-top">
            <h1>📝 Mis Tareas </h1>
            <button id="btn-tema" aria-label="Cambiar tema">🌙</button>
        </div>

        <form id="form-tarea">
            <div class="input-group">
                <input 
                    type="text" 
                    id="input-tarea" 
                    placeholder="¿Qué necesitas hacer?" 
                    required
                >
            </div>
            
            <div class="opciones-tarea">
                <select id="input-categoria">
                    <option value="personal">👤 Personal</option>
                    <option value="trabajo">💼 Trabajo</option>
                    <option value="estudio">📚 Estudio</option>
                    <option value="hogar">🏠 Hogar</option>
                </select>
                <input type="date" id="input-fecha">
                <button type="submit">Agregar</button>
            </div>
        </form>

        <div class="filtros">
            <button class="filtro activo" data-filtro="todas">Todas</button>
            <button class="filtro" data-filtro="pendientes">Pendientes</button>
            <button class="filtro" data-filtro="completadas">Listas</button>
        </div>

        <ul id="lista-tareas">
            </ul>

        <p class="contador">
            <span id="contador-pendientes">0</span> tareas pendientes
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
