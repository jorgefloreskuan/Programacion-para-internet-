<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina el Número</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>🔢 Adivina el Número</h1>
        <p>Hemos seleccionado un número aleatorio entre 1 y 100. ¿Puedes adivinarlo en 10 intentos?</p>

        <div class="form">
            <label for="guessField">Ingresa tu número: </label>
            <input type="number" min="1" max="100" id="guessField" class="guessField">
            <button id="guessSubmit" class="guessSubmit">Probar suerte</button>
        </div>

        <div class="resultParas">
            <p class="guesses"></p>
            <p class="lastResult"></p>
            <p class="lowOrHi"></p>
        </div>
        
        <button id="resetButton" style="display: none;">Empezar nuevo juego</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
